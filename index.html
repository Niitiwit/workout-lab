function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayDate(s){return new Date(s+'T12:00:00')}
function plusDate(s,n){const d=dayDate(s);d.setDate(d.getDate()+n);return localDate(d)}
function monday(s){return plusDate(s,-((dayDate(s).getDay()+6)%7))}
function daysBetween(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000)}
function weekOf(date,start){return Math.floor(daysBetween(date,start)/7)+1}
function phase(w){if(w<1)return {name:'Not started',rir:3,note:'Choose your start date in Settings.'};if(w<=2)return {name:'Adaptation',rir:3,note:'Learn the movements. Accessories are capped at 2 sets.'};if(w<=5)return {name:'Accumulation',rir:2,note:'Build quality reps within your assigned range.'};if(w===6)return {name:'Deload',rir:3,note:'Working sets reduced by about half. Keep 3–4 reps in reserve.'};if(w<=9)return {name:'Progressive overload',rir:2,note:'Progress with good technique and controlled reps.'};if(w<=11)return {name:'Intensification',rir:1,note:'Higher effort on safe isolation work. Keep compound technique consistent.'};if(w===12)return {name:'Evaluation',rir:2,note:'Compare strength, measurements and conditioning.'};return {name:'Cycle complete',rir:2,note:'Review your results and set a new cycle start when ready.'}}
function target(e,w){return w===6?Math.max(1,Math.ceil(e.sets/2)):w<=2&&!e.compound?Math.min(2,e.sets):e.sets}
function rirFloor(e,w){if(e.timed)return 0;if(w<=2)return 3;if(w===6)return 3;if(w===12)return 2;const digits=e.rir.match(/\d/g)||['1'];return Math.max(Math.min(...digits.map(Number)),w>=10&&w<=11&&!e.compound?0:1)}
function phaseRir(e,w){if(e.timed)return e.rir;if(w<=2)return '3';if(w===6)return '3–4';if(w===12)return '2–3';return e.rir}
const fresh=()=>({schema:1,settings:{start:monday(localDate()),unit:'plates',autoRest:true},sessions:[],measurements:[],cardio:[]});
let db=fresh(),storageFailed=false;
try{const saved=localStorage.getItem(KEY);if(saved){db=JSON.parse(saved);if(!validDB(db))throw Error('Invalid saved data')}}catch(e){storageFailed=true;db=fresh()}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={train:'M4 9v6m3-9v12m10-12v12m3-9v6M7 12h10',plan:'M5 4h14v17H5zM9 2v4m6-4v4M8 10h8m-8 4h8m-8 4h5',progress:'M4 4v16h17M7 15l4-5 4 2 5-7',history:'M4 8a9 9 0 1 1-1 6M3 3v6h6m3-2v6l4 2',settings:'M4 7h16M4 17h16M8 4v6m8 4v6'};

function persist(){if(storageFailed){toast('Storage needs attention. Export a backup before reloading.');return false}try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('save-status').textContent='Saved on this device';return true}catch(e){document.getElementById('save-status').textContent='Not saved · export a backup';toast('Storage is full or unavailable. Export a backup now.');return false}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.hidden=true,4200)}
function uid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function active(){return db.sessions.find(s=>s.id===activeId)}
function completed(s){return s.exercises.reduce((n,e)=>n+e.rows.filter(r=>r.done).length,0)}
function planned(s){return s.exercises.reduce((n,e)=>n+e.rows.length,0)}
function num(v){return v!==''&&v!=null&&Number.isFinite(Number(v))&&Number(v)>=0}
function validRow(r,e){return num(r.load)&&Number(r.load)<=10000&&num(r.reps)&&Number(r.reps)>0&&Number(r.reps)<=10000&&Number.isInteger(Number(r.reps))&&(!e.unilateral||(num(r.right)&&Number(r.right)>0&&Number(r.right)<=10000&&Number.isInteger(Number(r.right))))&&(e.timed||(num(r.rir)&&Number(r.rir)<=10))}
function previous(e,s){return db.sessions.filter(x=>x.id!==s.id&&x.date<s.date&&x.status==='finished').sort((a,b)=>b.date.localeCompare(a.date)||b.started-a.started).flatMap(x=>x.exercises.filter(y=>y.id===e.id&&y.unit===e.unit&&y.equipment===e.equipment&&y.name===e.name).map(y=>({date:x.date,exercise:y}))).find(x=>x.exercise.rows.some(r=>r.done))}
function progression(e,s){const rows=e.rows;if(e.timed)return 'Track hold duration and load together; add time within your range before increasing load.';if(!rows.length||!rows.every(r=>r.done))return 'Complete all planned sets to check progression.';if(!e.technique)return 'Confirm controlled technique before considering a load increase.';const load=Number(rows[0].load);if(!rows.every(r=>Number(r.load)===load))return 'Mixed loads this session. Compare sets at the same load before progressing.';if(rows.every(r=>Number(r.reps)>=e.high&&(!e.unilateral||Number(r.right)>=e.high)&&Number(r.rir)>=rirFloor(e,s.week)))return s.week===6?'Deload session: keep effort easy. Reassess load after deload.':'Top of range achieved at target RIR. Consider the smallest available increase next time.';return 'Keep this load and build clean reps toward '+e.high+' on every set at target RIR.'}
function restAfter(s,e,index){if(!/[12]$/.test(e.pair))return e.rest;const base=e.pair.slice(0,-1),partner=s.exercises.find(x=>x.pair===base+(e.pair.endsWith('1')?'2':'1'));const rest=e.rest||partner?.rest||90;return e.pair.endsWith('1')&&partner&&index<partner.rows.length&&!partner.rows[index].done?25:rest}
function startSession(){const exists=db.sessions.find(s=>s.date===selectedDate&&s.day===selectedDay&&s.status==='active');if(exists){activeId=exists.id;render();return}const w=weekOf(selectedDate,db.settings.start);const s={id:uid(),date:selectedDate,day:selectedDay,week:w,started:Date.now(),ended:null,status:'active',notes:'',sleep:'',energy:'',exercises:PROGRAM[selectedDay].map(e=>({...e,unit:e.name==='Side plank'?'bodyweight':db.settings.unit,equipment:'',technique:false,rows:Array.from({length:target(e,w)},()=>({load:e.name==='Side plank'?'0':'',reps:'',right:'',rir:'',done:false}))}))};db.sessions.push(s);activeId=s.id;persist();render()}
function setHTML(e,i,s){return `<tr class="${s.done?'checked':''}"><td>${i+1}</td><td><input type="number" inputmode="decimal" min="0" max="10000" step="any" data-field="load" data-ex="${e.id}" data-row="${i}" aria-label="${esc(e.name)} set ${i+1} load" value="${esc(s.load)}"></td><td><input type="number" inputmode="numeric" min="1" max="10000" step="1" data-field="reps" data-ex="${e.id}" data-row="${i}" aria-label="${esc(e.name)} set ${i+1} ${e.unilateral?'left ':''}${e.timed?'seconds':'reps'}" value="${esc(s.reps)}"></td>${e.unilateral?`<td><input type="number" inputmode="numeric" min="1" max="10000" step="1" data-field="right" data-ex="${e.id}" data-row="${i}" aria-label="${esc(e.name)} set ${i+1} right ${e.timed?'seconds':'reps'}" value="${esc(s.right)}"></td>`:''}${!e.timed?`<td><input type="number" inputmode="decimal" min="0" max="10" step="0.5" data-field="rir" data-ex="${e.id}" data-row="${i}" aria-label="${esc(e.name)} set ${i+1} RIR" value="${esc(s.rir)}"></td>`:''}<td><button class="done" data-action="complete-set" data-ex="${e.id}" data-row="${i}" aria-label="${s.done?'Unmark':'Complete'} ${esc(e.name)} set ${i+1}" aria-pressed="${s.done}">${s.done?'✓':'○'}</button></td></tr>`}
function exerciseHTML(e,s,i){const prev=previous(e,s),done=e.rows.filter(r=>r.done).length;return `<details class="card exercise" data-details="${e.id}" ${done<e.rows.length&&i===s.exercises.findIndex(x=>x.rows.some(r=>!r.done))?'open':''}><summary><span class="pair">${e.pair}</span><div style="flex:1"><h3>${esc(e.name)}</h3><small>${e.rows.length} × ${e.low}–${e.high}${e.timed?' sec':''}${e.unilateral?' / side':''} · ${esc(e.muscle)}</small></div><span class="badge ${done===e.rows.length?'lime':''}">${done}/${e.rows.length}</span></summary><div class="ex-content"><div class="ex-meta"><span class="badge">${e.timed?esc(e.rir):'RIR '+esc(phaseRir(e,s.week))}</span><span class="badge">${e.rest?e.rest+'s rest':'25s transition'}</span>${/[12]$/.test(e.pair)?`<span class="badge orange">Pair ${e.pair[0]}</span>`:''}</div><div class="fields"><label>Load unit<select data-ex="${e.id}" data-efield="unit">${['plates','kg','lb','bodyweight'].map(x=>`<option ${e.unit===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Machine / setup<input data-ex="${e.id}" data-efield="equipment" maxlength="120" placeholder="e.g. Cable 1, per side" value="${esc(e.equipment)}"></label></div><p class="hint">${prev?'Last matching session · '+prev.date+'<br>'+prev.exercise.rows.filter(r=>r.done).map(r=>`${esc(r.load)} ${e.unit} × ${esc(r.reps)}${e.unilateral?'/'+esc(r.right):''}${e.timed?'s':''}`).join(' · '):'Your baseline starts here. Log the machine and whether load is per side or total.'}</p>${prev?`<button class="small quiet" data-action="copy-last" data-ex="${e.id}">Copy previous loads</button>`:''}<div class="table-scroll"><table class="sets"><thead><tr><th>Set</th><th>${esc(e.unit==='bodyweight'?'Added kg':e.unit)}</th><th>${e.unilateral?'L ':''}${e.timed?'sec':'reps'}</th>${e.unilateral?`<th>R ${e.timed?'sec':'reps'}</th>`:''}${e.timed?'':'<th>RIR</th>'}<th>Done</th></tr></thead><tbody>${e.rows.map((r,j)=>setHTML(e,j,r)).join('')}</tbody></table></div><div class="row set-act function stats(){const m=monday(selectedDate),end=plusDate(m,7),sessions=db.sessions.filter(s=>s.date>=m&&s.date<end),finished=sessions.filter(s=>s.status==='finished');return {sessions,finished,sets:sessions.reduce((n,s)=>n+completed(s),0),minutes:db.cardio.filter(c=>c.date>=m&&c.date<end).reduce((n,c)=>n+Number(c.minutes),0)}}

function planHTML(){const w=weekOf(selectedDate,db.settings.start);return titleHTML('The long game.','5 training days · 12-week cycle')+`<div class="card"><div class="row wrap"><h2>Your training cycle</h2><span class="badge lime">${phase(w).name}</span></div><div class="phases">${Array.from({length:12},(_,i)=>`<span class="${w===i+1?'current':''}">${i+1}</span>`).join('')}</div><p class="muted">${phase(w).note}</p><div class="table-scroll"><table><thead><tr><th>Weeks</th><th>Phase</th><th>Focus</th></tr></thead><tbody><tr><td>1–2</td><td>Adaptation</td><td>Most accessories: 2 sets · RIR 3</td></tr><tr><td>3–5</td><td>Accumulation</td><td>Full targets · assigned RIR</td></tr><tr><td>6</td><td>Deload</td><td>About half the sets · RIR 3–4</td></tr><tr><td>7–9</td><td>Overload</td><td>Build reps and resistance</td></tr><tr><td>10–11</td><td>Intensification</td><td>Controlled effort; no forced failure</td></tr><tr><td>12</td><td>Evaluation</td><td>Compare results · RIR 2–3</td></tr></tbody></table></div></div><h2 class="sectiontitle">Your weekly blueprint</h2><div class="stack">${PROGRAM.map((day,d)=>`<details class="card"><summary><b>${['Monday','Tuesday','Wednesday','Thursday','Friday'][d]} · ${TITLES[d]}</b><p class="muted">${DESCRIPTIONS[d]}</p></summary><div class="table-scroll"><table><thead><tr><th>Pair / exercise</th><th>Full sets</th><th>Reps / sec</th><th>RIR</th><th>Rest</th></tr></thead><tbody>${day.map(e=>`<tr><td>${e.pair} · ${e.name}</td><td>${e.sets}</td><td>${e.low}–${e.high}${e.timed?'s':''}${e.unilateral?' / side':''}</td><td>${e.rir}</td><td>${e.rest?e.rest+'s':'Transition'}</td></tr>`).join('')}</tbody></table></div><button class="small" style="margin-top:18px" data-action="choose-day" data-day="${d}">Use this workout</button></details>`).join('')}<div class="card"><h3>Saturday & Sunday · Recovery</h3><p class="muted">Optional comfortable walking and mobility. Keep room for recovery.</p></div><div class="card"><h3>Progression rule</h3><p>Reach the to function lineChart(points,label){if(!points.length)return `<div class="empty"><strong>Your progress starts with a session.</strong>Log a workout to see ${esc(label)} over time.</div>`;const vals=points.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const xy=points.map((p,i)=>[30+(points.length===1?.5:i/(points.length-1))*540,130-(p.value-min)/range*100]);return `<svg class="chart" viewBox="0 0 600 170" role="img" aria-label="${esc(label)}"><path d="M30 135H570" stroke="#354037"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ccf77e" stroke-width="3"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#ccf77e"><title>${points[i].date}: ${points[i].value}</title></circle>`).join('')}<text x="30" y="163" fill="#a6b3a8" font-size="13">${points[0].date}</text><text x="570" y="163" text-anchor="end" fill="#a6b3a8" font-size="13">${points.at(-1).date}</text></svg>`}
function exerciseRecords(){return db.sessions.filter(s=>s.status==='finished').sort((a,b)=>a.date.localeCompare(b.date)).flatMap(s=>s.exercises.filter(e=>e.id===filterExercise&&e.unit===filterUnit&&e.rows.some(r=>r.done)).map(e=>({date:s.date,e,rows:e.rows.filter(r=>r.done)})))}
function progressHTML(){const a=stats(),recs=exerciseRecords(),points=recs.map(x=>({date:x.date,value:Math.max(...x.rows.map(r=>Number(r.load)))})),weights=db.measurements.filter(x=>num(x.weight)).sort((a,b)=>a.date.localeCompare(b.date));return titleHTML('Evidence of effort.','Small improvements, logged consistently')+`<div class="metrics"><div class="metric"><strong>${new Set(a.finished.map(s=>s.day)).size}<span> / 5</span></strong><span>Workout types this week</span></div><div class="metric"><strong>${a.sets}</strong><span>Working sets this week</span></div><div class="metric"><strong>${a.minutes}</strong><span>Cardio minutes this week</span></div></div><div class="grid"><div class="stack"><div class="card"><h2>Strength trend</h2><div class="fields"><label>Exercise<select id="progress-exercise">${[...new Map(PROGRAM.flat().map(e=>[e.id,e])).values()].map(e=>`<option value="${e.id}" ${filterExercise===e.id?'selected':''}>${e.name}</option>`).join('')}</select></label><label>Unit<select id="progress-unit">${['plates','kg','lb','bodyweight'].map(u=>`<option ${u===filterUnit?'selected':''}>${u}</option>`).join('')}</select></label></div><p class="muted" style="font-size:13px">Heaviest completed set per session (${filterUnit==='bodyweight'?'added kg':filterUnit}). Check reps, setup and technique below before comparing.</p>${lineChart(points,'heaviest set load')}<div class="table-scroll"><table><thead><tr><th>Date / setup</th><th>Completed sets</th></tr></thead><tbody>${recs.slice(-8).reverse().map(x=>`<tr><td>${x.date}<br><small>${esc(x.e.name)} · ${esc(x.e.equipment||'Setup not recorded')}</small></td><td>${x.rows.map(r=>`${r.load} × ${r.reps}${x.e.unilateral?'/'+r.right:''}${x.e.timed?'s':''}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Body weight</h2>${lineChart(weights.map(x=>({date:x.date,value:Number(x.weight)})),'body weight (kg)')}<small>Use consistent conditions. Measurements are logged below.</small></div>${measureHTML()}</div><aside class="card"><h2>Muscle coverage</h2><p class="muted" style="font-size:13px">Completed / planned sets · week of ${monday(selectedDate)}</p>${volumeHTML()}<small>One primary group per exercise. Compounds also train secondary muscles; these are not counted twice. Both sides together count as one set.</small></aside></div>`}
function measureHTML(){const latest=[...db.measurements].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h2>Measure what matters.</h2><p class="muted" style="font-size:14px">Track body weight regularly; compare circumferences every four weeks, without a workout pump.</p><form id="measure-form"><div class="fields">${MEASURES.map(([k,l])=>`<label>${l}<input type="number" name="${k}" min="1" max="500" step="0.1" inputmode="decimal" placeholder="—"></label>`).join('')}</div><p><small>Recording for ${selectedDate}. Empty fields leave existing values unchanged.</small></p><button class="primary">Save measurements</button></form>${latest.length?`<div class="table-scroll" style="margin-top:20px"><table><thead><tr><th>Date</th><th>Weight</th><th>Waist</th><th>Arm</th><th></th></tr></thead><tbody>${latest.slice(0,12).map(m=>`<tr><td>${m.date}</td><td>${esc(m.weight||'—')}</td><td>${esc(m.waist||'—')}</td><td>${esc(m.arm||'—')}</td><td><button class="small quiet" data-action="view-measure" data-id="${m.id}">Details</button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`}
function historyHTML(){const ss=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.started-a.started),cc=[...db.cardio].sort((a,b)=>b.date.localeCompare(a.date));return titleHTML('Your training journal.','Every session adds up')+`<div class="card"><h2>Workouts</h2>${ss.length?ss.map(s=>`<div class="history-item"><div class="row"><div><h3>${TITLES[s.day]}</h3><small>${s.date} · ${completed(s)}/${planned(s)} sets · ${s.status==='finished'?'Finished':'In progress'}</small></div><button class="small" data-action="open-session" data-id="${s.id}">${s.status==='finished'?'Edit':'Resume'}</button></div>${s.notes?`<p class="muted" style="font-size:14px;white-space:pre-wrap">${esc(s.notes)}</p>`:''}<button class="small quiet danger" style="margin-top:10px" data-action="delete-session" data-id="${s.id}">Delete session</button></div>`).join(''):'<div class="empty"><strong>A fresh page.</strong>Your completed and in-progress workouts will appear here.</div>'}</div><div class="card sectiontitle"><h2>Cardio journal</h2>${cc.length?`<div class="table-scroll"><table><thead><tr><th>Date</th><th>Activity</th><th>Min</th><th>km/h</th><th>Incline</th><th>HR</th><th>RPE</th></tr></thead><tbody>${cc.map(c=>`<tr><td>${c.date}</td><td>${esc(c.activity)}</td><td>${c.minutes}</td><td>${c.speed||'—'}</td><td>${c.incline||'—'}</td><td>${c.hr||'—'}</td><td>${c.rpe||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Log conditioning from the Train tab.</p>'}</div>`}
function settingsHTML(){return titleHTML('Make it yours.','Your program · your data')+`<div class="body-grid"><div class="stack"><div class="card"><h2>Training preferences</h2><label>Cycle start date<input type="date" id="start-date" value="${db.settings.start}"></label><p><small>Week 1 starts here. Existing workout targets remain as logged.</small></p><label>Default load unit<select id="default-unit">${['plates','kg','lb'].map(u=>`<option ${db.settings.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="ticklabel"><input id="auto-rest" type="checkbox" ${db.settings.autoRest?'checked':''}>Start rest timer after logging a set</label><p class="muted" style="font-size:13px">Timers use the clock and recover after screen lock. Check the visual countdown when you return; background sound alerts are not provided.</p></div><div class="card"><h2>Your data stays yours.</h2><p class="muted">Logs are saved in this browser or Home Screen app on this device. They do not sync through GitHub or across devices.</p><p class="muted">Export regularly. Clearing website data, switching browsers or losing your phone can remove local records. Use a backup to transfer them.</p><div class="stack"><button class="primary" data-action="backup">Export full backup (JSON)</button><button data-action="import">Restore / merge backup</button><button data-action="csv">Export workout sets (CSV)</button><a href="./index.html" download="workout-tracker.html">Download HTML template</a></div>${storageFailed?'<p class="danger">Saved data could not be read. Export recovery data before using a fresh store.</p><button data-action="recover">Download original recovery data</button><button data-action="reset-storage">Start a fresh store</button>':''}<small style="display:block;margin-top:15px">Restore validates the file, merges unique IDs, and asks before replacing matching records. Only import backups you trust.</small></div></div><div class="stack"><div class="card install"><span class="eyebrow">MADE FOR YOUR IPHONE</span><h2 style="margin-top:12px">One tap. Ready to train.</h2><ol><li>Open the published website in Safari.</li><li>Tap the Share button.</li><li>Select <b>Add to Home Screen</b>.</li><li>Keep <b>Open as Web App</b> enabled if shown, then tap <b>Add</b>.</li></ol><p>Open the new icon once online to prepare offline use.</p><small id="install-status">Checking offline readiness…</small></div><div class="card"><h3>Training notes</h3><p class="muted" style="font-size:14px">This tracker follows your supplied five-day program. It records training, not a medical assessment or a prediction of results.</p><p class="muted" style="font-size:14px">Reduce volume when recovery or performance drops. Stop exercise for concerning symptoms and seek appropriate care.</p><p class="muted" style="font-size:14px">Nutrition and recovery targets from your plan: protein 150–180 g/day and sleep 7–9 hours. Revisit targets as your needs change.</p></div></div></div>`}
function render(){const nav=Object.keys(icons).map(x=>`<button data-action="nav" data-view="${x}" class="${view===x?'active':''}" ${view===x?'aria-current="page"':''}>${icon(x)}<span>${x==='settings'?'Settings':x[0].toUpperCase()+x.slice(1)}</span></button>`).join('');document.querySelector('.nav').innerHTML=nav;document.querySelector('.bottomnav').innerHTML=nav;document.getElementById('app').innerHTML=({train:trainHTML,plan:planHTML,progress:progressHTML,history:historyHTML,settings:settingsHTML})[view]();if(storageFailed)document.getElementById('save-status').textContent='Storage needs attention';if(view==='settings')offlineStatus()}
function renderKeep(){const open=[...document.querySelectorAll('[data-details][open]')].map(el=>el.dataset.details);render();for(const el of document.querySelectorAll('[data-details]'))el.open=open.includes(el.dataset.details)}
function ask(title,body,fn){document.getElementById('confirm-yes').textContent='Confirm';document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-body').textContent=body;confirmFn=fn;document.getElementById('confirm-dialog').showModal()}
let timerEnd=0,timerName='Rest';try{const t=JSON.parse(localStorage.getItem(KEY+'-timer')||'null');if(t){timerEnd=t.end;timerName=t.name}}catch(e){}
function startTimer(seconds,label){timerEnd=Date.now()+seconds*1000;timerName=label;saveTimer();tick()}
function saveTimer(){try{localStorage.setItem(KEY+'-timer',JSON.stringify({end:timerEnd,name:timerName}))}catch(e){}}
function tick(){const el=document.getElementById('timer');if(!timerEnd){el.hidden=true;return}el.hidden=false;const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timer-label').textContent=left?timerName:'Rest complete';document.getElementById('timer-value').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`}
function exportFile(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function backup(){exportFile('workout-lab-backup-'+localDate()+'.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup download started. Save it to Files.')}
function csv(){const rows=[['date','workout','exercise','machine_setup','unit','set','load','left_or_reps','right','seconds_mode','rir','completed']];db.sessions.forEach(s=>s.exercises.forEach(e=>e.rows.forEach((r,i)=>rows.push([s.date,TITLES[s.day],e.name,e.equipment,e.unit,i+1,r.load,r.reps,r.right,e.timed,r.rir,r.done]))));const safe=x=>{let v=String(x??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};exportFile('workout-lab-sets-'+localDate()+'.csv','\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validDB(d){const obj=x=>x&&typeof x==='object'&&!Array.isArray(x),str=(s,max=2000)=>typeof s==='string'&&s.length<=max,date=s=>str(s,10)&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(dayDate(s)),id=s=>str(s,100)&&/^[a-zA-Z0-9-]+$/.test(s),finite=v=>typeof v==='number'&&Number.isFinite(v),val=v=>v===''||((typeof v==='string'||typeof v==='number')&&num(v)&&Number(v)<=10000);if(!obj(d)||d.schema!==1||!obj(d.settings)||!date(d.settings.start)||!['plates','kg','lb'].includes(d.settings.unit)||typeof d.settings.autoRest!=='boolean'||!['sessions','measurements','cardio'].every(k=>Array.isArray(d[k])&&d[k].length<=10000))return false;const unique=a=>new Set(a.map(x=>x.id)).size===a.length;
if(!['sessions','measurements','cardio'].every(k=>unique(d[k])))return false;
return d.sessions.every(s=>obj(s)&&id(s.id)&&date(s.date)&&Number.isInteger(s.day)&&s.day>=0&&s.day<5&&Number.isInteger(s.week)&&finite(s.started)&&(s.ended===null||finite(s.ended))&&['active','finished'].includes(s.status)&&str(s.notes)&&val(s.sleep)&&str(s.energy,20)&&Array.isArray(s.exercises)&&s.exercises.length>0&&s.exercises.length<=50&&unique(s.exercises)&&s.exercises.every(e=>obj(e)&&id(e.id)&&str(e.name,120)&&str(e.equipment,120)&&str(e.muscle,80)&&/^[A-G][12]?$/.test(e.pair)&&['plates','kg','lb','bodyweight'].includes(e.unit)&&[e.low,e.high,e.rest,e.sets].every(finite)&&e.low>0&&e.high>=e.low&&e.high<=10000&&e.rest>=0&&e.rest<=600&&typeof e.timed==='boolean'&&typeof e.unilateral==='boolean'&&typeof e.technique==='boolean'&&str(e.rir,20)&&Array.isArray(e.rows)&&e.rows.length>0&&e.rows.length<=30&&e.rows.every(r=>obj(r)&&[r.load,r.reps,r.right,r.rir].every(val)&&typeof r.done==='boolean'&&(!r.done||validRow(r,e)))))&&d.measurements.every(m=>obj(m)&&id(m.id)&&date(m.date)&&MEASURES.every(([k])=>val(m[k]??'')))&&d.cardio.every(c=>obj(c)&&id(c.id)&&date(c.date)&&str(c.activity,80)&&num(c.minutes)&&Number(c.minutes)>0&&['minutes','rpe','speed','incline','hr','distance'].every(k=>val(c[k]??'')))}
function mergeBackup(incoming){const next=structuredClone(db);for(const key of ['sessions','measurements','cardio']){const map=new Map(next[key].map(x=>[x.id,x]));incoming[key].forEach(x=>map.set(x.id,x));next[key]=[...map.values()]}return next}
function offlineStatus(){const el=document.getElementById('install-status');if(!el)return;el.textContent=location.protocol==='file:'?'For installation and offline caching, use the published HTTPS website.':navigator.serviceWorker?.controller?'Offline app shell ready on this device.':'Open once online; offline setup is preparing.'}
function onAction(ev){const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,s=active(),e=s?.exercises.find(e=>e.id===b.dataset.ex),i=Number(b.dataset.row);
if(a==='nav'){view=b.dataset.view;render();window.scrollTo(0,0)}
if(a==='date'){selectedDate=b.dataset.date;selectedDay=Math.min(4,(dayDate(selectedDate).getDay()+6)%7);activeId=null;render()}
if(a==='start')startSession();
if(a==='choose-day'){selectedDay=Number(b.dataset.day);activeId=null;view='train';render();window.scrollTo(0,0)}
if(a==='complete-set'&&e){const r=e.rows[i];if(!r.done&&!validRow(r,e)){toast('Enter load (0 is allowed), reps for each side, and RIR before logging.');return}r.done=!r.done;persist();if(r.done&&db.settings.autoRest)startTimer(restAfter(s,e,i),restAfter(s,e,i)===25?'Switch to paired exercise':'Rest · '+e.pair);renderKeep()}
if(a==='add-set'&&e){if(e.rows.length>=30)return;e.rows.push({load:'',reps:'',right:'',rir:'',done:false});persist();renderKeep()}
if(a==='remove-set'&&e&&e.rows.length>1){const remove=()=>{e.rows.pop();persist();renderKeep()};if(e.rows.at(-1).done||e.rows.at(-1).reps!=='')ask('Remove last set?','This removes the last set and its entered values from this exercise.',remove);else remove()}
if(a==='copy-last'&&e){const p=previous(e,s);if(p){e.rows.forEach((r,j)=>{if(!r.done&&r.load==='')r.load=p.exercise.rows[j]?.load??p.exercise.rows.at(-1).load});persist();renderKeep();toast('Previous loads copied into empty sets.')}}
if(a==='finish'&&s){if(!completed(s)){toast('Log at least one set before finishing.');return}const finish=()=>{s.status='finished';s.ended=Date.now();persist();activeId=null;view='history';timerEnd=0;saveTimer();tick();render();window.scrollTo(0,0);toast('Workout saved. Good work.')};if(completed(s)<planned(s))ask('Finish with incomplete sets?',`${completed(s)} of ${planned(s)} sets are logged. Unlogged sets will remain incomplete.`,finish);else finish()}
if(a==='leave'){activeId=null;render()}
if(a==='open-session'){activeId=b.dataset.id;const x=active();selectedDate=x.date;selectedDay=x.day;view='train';render();window.scrollTo(0,0)}
if(a==='delete-session')ask('Delete this workout?','Export a backup first if you may need this record. Other workouts are unchanged.',()=>{db.sessions=db.sessions.filter(x=>x.id!==b.dataset.id);if(activeId===b.dataset.id)activeId=null;persist();render()});
if(a==='delete-cardio')ask('Delete cardio record?','This removes the selected cardio entry.',()=>{db.cardio=db.cardio.filter(x=>x.id!==b.dataset.id);persist();render()});
if(a==='view-measure'){const m=db.measurements.find(x=>x.id===b.dataset.id);ask('Measurements · '+m.date,MEASURES.map(([k,l])=>l+': '+(m[k]||'—')).join(' · '),()=>{});document.getElementById('confirm-yes').textContent='Close'}
if(a==='backup')backup();if(a==='csv')csv();if(a==='import')document.getElementById('import-file').click();
if(a==='timer-stop'){timerEnd=0;saveTimer();tick()}if(a==='timer-add'){timerEnd=Math.max(Date.now(),timerEnd)+30000;saveTimer();tick()}
if(a==='recover')exportFile('workout-lab-recovery.txt',localStorage.getItem(KEY)||'No stored data','text/plain');
if(a==='reset-storage')ask('Start fresh?','Export the original recovery data first. This replaces the unreadable store.',()=>{storageFailed=false;db=fresh();persist();render()});
}
function onChange(ev){const el=ev.target,s=active(),e=s?.exercises.find(e=>e.id===el.dataset.ex);if(el.dataset.field&&e){const r=e.rows[Number(el.dataset.row)];if(el.value!==''&&(!num(el.value)||Number(el.value)>(el.dataset.field==='rir'?10:10000))){if(ev.type==='change'){el.value=r[el.dataset.field];toast('Enter a valid non-negative value within the field limit.')}return}r[el.dataset.field]=el.value;if(r.done&&!validRow(r,e))r.done=false;persist();if(ev.type==='change')renderKeep();return}
if(el.dataset.efield&&e){e[el.dataset.efield]=el.type==='checkbox'?el.checked:el.value.trim();persist();if(ev.type==='change')renderKeep();return}
if(el.dataset.session&&s){if(el.dataset.session==='sleep'&&el.value!==''&&(!num(el.value)||Number(el.value)>24)){if(ev.type==='change'){el.value=s.sleep;toast('Sleep must be between 0 and 24 hours.')}return}s[el.dataset.session]=el.value;persist();return}
if(ev.type!=='change')return;
if(el.id==='selected-date'&&el.value){selectedDate=el.value;selectedDay=Math.min(4,(dayDate(selectedDate).getDay()+6)%7);activeId=null;render()}
if(el.id==='day-select'){selectedDay=Number(el.value);render()}
if(el.id==='start-date'&&el.value){db.settings.start=el.value;persist();render()}
if(el.id==='default-unit'){db.settings.unit=el.value;persist()}
if(el.id==='auto-rest'){db.settings.autoRest=el.checked;persist()}
if(el.id==='progress-exercise'){filterExercise=el.value;render()}
if(el.id==='progress-unit'){filterUnit=el.value;render()}
}
function onSubmit(ev){if(!['cardio-form','measure-form'].includes(ev.target.id))return;ev.preventDefault();const data=Object.fromEntries(new FormData(ev.target));if(ev.target.id==='cardio-form'){db.cardio.push({id:uid(),date:selectedDate,...data});persist();renderKeep();toast('Cardio saved.')}else{if(!Object.values(data).some(x=>x!=='')){toast('Enter at least one measurement.');return}const old=db.measurements.find(m=>m.date===selectedDate),filled=Object.fromEntries(Object.entries(data).filter(([,v])=>v!==''));if(old)Object.assign(old,filled);else db.measurements.push({id:uid(),date:selectedDate,...data});persist();render();toast('Measurements saved.')}}
// BOOT
render();document.addEventListener('click',onAction);document.addEventListener('input',onChange);document.addEventListener('change',onChange);document.addEventListener('submit',onSubmit);document.getElementById('confirm-no').onclick=()=>document.getElementById('confirm-dialog').close();document.getElementById('confirm-yes').onclick=()=>{document.getElementById('confirm-dialog').close();const fn=confirmFn;confirmFn=null;document.getElementById('confirm-yes').textContent='Confirm';fn?.()};
document.getElementById('import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;if(file.size>15000000){toast('Backup is too large (15 MB maximum).');return}try{const incoming=JSON.parse(await file.text());if(!validDB(incoming))throw Error('schema');const count=incoming.sessions.length+incoming.cardio.length+incoming.measurements.length;ask('Merge this backup?',`${count} records found. Matching IDs will be replaced with backup values. New records will be added; your program settings stay unchanged. Export your current backup first if needed.`,()=>{db=mergeBackup(incoming);activeId=null;persist();render();toast('Backup merged.')})}catch(e){toast('This is not a valid Workout Lab backup. Nothing was changed.')}});
setInterval(tick,1000);tick();document.addEventListener('visibilitychange',tick);window.addEventListener('online',offlineStatus);window.addEventListener('offline',()=>toast('Offline. Keep training; logs save on this device.'));
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(offlineStatus).catch(()=>{const e=document.getElementById('install-status');if(e)e.textContent='Offline setup unavailable. Online logging still works.'});navigator.serviceWorker.addEventListener('controllerchange',offlineStatus)}
</script></body></html>
